name: Deploy project page
on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'scripts/build_showcase_demo.py'
      - 'scripts/test_showcase.cjs'
      - 'scripts/test_gallery.cjs'
      - 'scripts/test_methods.cjs'
      - 'scripts/build_gallery_data.py'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Rebuild the synthetic example and check the page
        run: |
          python scripts/build_showcase_demo.py
          node --check showcase/app.js
          node --check showcase/run.js
          node --check showcase/gallery.js
          node --check showcase/methods.js
          node --test scripts/test_showcase.cjs scripts/test_gallery.cjs scripts/test_methods.cjs scripts/test_event_sunburst.cjs scripts/test_enterprise_network.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: showcase
      - name: Wait for the uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          name = os.environ['PAGES_ARTIFACT_NAME']
          url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts')
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json'})
          for attempt in range(20):
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == name and not a['expired']]
              if len(matches) == 1:
                  print('Pages artifact metadata ready: ' + name)
                  break
              time.sleep(2)
          else:
              raise RuntimeError('Pages artifact metadata did not become available')
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
